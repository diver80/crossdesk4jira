app:
  id: ari:cloud:ecosystem::app/8014e024-841c-4e53-8347-e9ea99323fd7
  runtime:
    name: nodejs22.x

modules:
  jira:dashboardGadget:
    - key: crossdesk4jira-gadget
      title: Cross-Site Work Items
      description: Aggregates Jira issues across multiple Atlassian Cloud sites and accounts.
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/issue.svg
      resource: main-gadget
      edit:
        resource: main-gadget
      resolver:
        function: gadget-resolver

  # OAuth 2.0 (3LO) redirect target. Forge External Auth rejects Atlassian OAuth
  # clients, so the code exchange is handled by the app itself (see src/oauth).
  webtrigger:
    - key: oauth-callback
      function: oauth-callback-fn
      response:
        type: dynamic

  function:
    - key: gadget-resolver
      handler: index.handler
    - key: oauth-callback-fn
      handler: index.oauthCallback

resources:
  - key: main-gadget
    path: static/gadget/dist

permissions:
  scopes:
    - storage:app
  external:
    fetch:
      backend:
        - address: https://auth.atlassian.com
        - address: https://api.atlassian.com
